server:
  port: 8080
  servlet:
    context-path: /svmvp

spring:
  datasource:
    url: jdbc:h2:mem:scalevisionmvc
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

app:
  cors:
    allowed-origins: http://localhost:3000
  storage:
    upload-dir: uploads
  ai:
    base-url: http://localhost:8000
    local-processing-dir: /tmp/scalevision-ia-check
