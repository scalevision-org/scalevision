server:
  port: 8080
  servlet:
    context-path: /svmvp

spring:
  datasource:
    url: jdbc:h2:mem:scalevisionmvc
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

app:
  cors:
    # Incluir el origen del frontend (Vite por defecto usa 5173)
    allowed-origins: http://localhost:3000,http://localhost:5173
  storage:
    upload-dir: uploads
  ai:
    base-url: http://localhost:8000
    # Carpeta en el proyecto IA donde el BE copia el video; la IA lee desde incoming_from_backend
    local-processing-dir: C:/Programacion Local/scalevision/incoming_from_backend
